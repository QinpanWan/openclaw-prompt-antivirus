name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build (emit dist)
        run: npx tsc -p tsconfig.json

      - name: Smoke import
        run: |
          node -e "import('./dist/index.js').then(()=>{console.log('IMPORT_OK')}).catch(e=>{console.error('IMPORT_FAIL', e.message); process.exit(1)})"
